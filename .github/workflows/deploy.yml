name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  # New Substack posts appear on the homepage only after a rebuild, so rebuild
  # daily. 11:00 UTC is early morning US.
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          # Not a secret, and already the default in .firebaserc. Hardcoded so
          # setup is one secret and nothing else; an unset repo variable here
          # resolves to an empty string and fails in a confusing way.
          projectId: thetocque
